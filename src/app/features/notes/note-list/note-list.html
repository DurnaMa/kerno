<div class="p-4">
  <h1 class="text-2xl font-bold mb-4">Meine Notizen</h1>
  <app-note-editor (noteSaved)="loadNotes()"></app-note-editor>
  <input (input)="onSearch($event)" placeholder="Suchen..." />
  @if (loading()) {
    <div>Lädt...</div>
  }

  @if (!loading() && notes().length === 0) {
    <div>Noch keine Notizen vorhanden.</div>
  }

  @for (note of filteredNotes(); track note.id) {
    <div>{{ note.title }}</div>
    <div>{{ note.content }}</div>
  }
</div>
