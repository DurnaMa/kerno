<div class="p-4">
  <h1 class="text-2xl font-bold mb-4">Meine Notizen</h1>

  <div *ngIf="loading">Lädt...</div>

  <div *ngIf="!loading && notes.length === 0">
    Noch keine Notizen vorhanden.
  </div>

  <div *ngFor="let note of notes" class="border rounded p-3 mb-2">
    <h2 class="font-semibold">{{ note.title }}</h2>
    <p class="text-sm text-gray-500">{{ note.created_at | date }}</p>
  </div>
</div>
